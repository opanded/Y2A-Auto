<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none"
     preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <!--
    Hero 背景：把「视频从源站流入、经处理、再发布」画成一道信号流。
    左侧留白（文字区），构图重心压在右侧 40%，低对比度不抢文字。
  -->
  <defs>
    <linearGradient id="ribbonA" x1="120" y1="300" x2="1140" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d6efd" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#2f7dfd" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="300" y1="320" x2="1160" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0dcaf0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#6ea8ff" stop-opacity="0.32"/>
      <stop offset="0.65" stop-color="#8b9cff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#8b9cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.32" stop-color="#a9ccff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#a9ccff" stop-opacity="0"/>
    </radialGradient>

    <!-- 点阵：模拟数据网格，靠右侧淡出 -->
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.15" fill="#0d6efd" fill-opacity="0.17"/>
    </pattern>
    <linearGradient id="gridFade" x1="560" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask">
      <rect x="540" y="0" width="660" height="320" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <ellipse cx="952" cy="126" rx="368" ry="158" fill="url(#halo)"/>
  <rect x="540" y="0" width="660" height="320" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- 信号带：主带（粗）+ 记忆带（细） -->
  <path d="M-40 288C224 288 302 176 522 150C702 129 822 96 1012 54C1082 38 1142 30 1250 24"
        stroke="url(#ribbonA)" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M-40 248C244 248 338 130 558 111C744 95 854 71 1032 33C1102 18 1152 13 1250 8"
        stroke="url(#ribbonB)" stroke-width="1.15" stroke-linecap="round"/>
  <path d="M120 318C340 318 420 214 624 190C798 169 902 140 1074 104"
        stroke="url(#ribbonA)" stroke-width="0.9" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- 同心弧：信号辐射，与主带交汇于右上方 -->
  <g stroke="url(#ribbonA)" stroke-linecap="round">
    <path d="M876 320A190 190 0 0 1 1066 130" stroke-width="1.05" stroke-opacity="0.42"/>
    <path d="M832 320A236 236 0 0 1 1068 84" stroke-width="0.95" stroke-opacity="0.24"/>
    <path d="M922 320A146 146 0 0 1 1068 174" stroke-width="1.1" stroke-opacity="0.5"/>
    <path d="M964 320A96 96 0 0 1 1060 224" stroke-width="0.9" stroke-opacity="0.3"/>
  </g>

  <!-- 节点：处理链路上的关键点 -->
  <g>
    <circle cx="700" cy="126" r="11" fill="url(#nodeGlow)"/>
    <circle cx="700" cy="126" r="2.4" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="906" cy="82" r="14" fill="url(#nodeGlow)" fill-opacity="0.8"/>
    <circle cx="906" cy="82" r="2.8" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="1064" cy="44" r="9" fill="url(#nodeGlow)" fill-opacity="0.7"/>
    <circle cx="1064" cy="44" r="2" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <!-- 细碎星点：避免大面积留白显得空 -->
  <g fill="#ffffff">
    <circle cx="792" cy="188" r="1.1" fill-opacity="0.5"/>
    <circle cx="988" cy="140" r="1.2" fill-opacity="0.45"/>
    <circle cx="1140" cy="96" r="1" fill-opacity="0.4"/>
    <circle cx="636" cy="96" r="1" fill-opacity="0.35"/>
    <circle cx="856" cy="240" r="1.1" fill-opacity="0.3"/>
  </g>
</svg>
